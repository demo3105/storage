name: Deploy JSON to Storage (Converted)

on:
  workflow_dispatch:
 
    
 
concurrency:
  group: github-metadata-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write
  contents: read

jobs:
  get_environment:
    name: Get Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.get_environment.outputs.environment }}
      #deploy_env: ${{ steps.get_environment.outputs.deploy_env }}
    steps:
      - id: get_environment
        run: |
          branch="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}"
          if [ "$branch" == "test" ]; then
            echo "environment=qa" >> "$GITHUB_OUTPUT"
            #echo "deploy_env=test-deploy" >> "$GITHUB_OUTPUT"
          elif [ "$branch" == "main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "deploy_env=prod-deploy" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            #echo "deploy_env=dev-deploy" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy Metadata - ${{ needs.get_environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [get_environment]
    environment: ${{ needs.get_environment.outputs.deploy_env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      # Load environment parameter YAML
      - name: Load environment parameters
        id: params
        run: |
          ENV="${{ needs.get_environment.outputs.environment }}"
          PARAM_FILE="parameter/${ENV}.yml"

          echo "Using parameter file: $PARAM_FILE"
                
          STORAGE_ACCOUNT=$(yq '.storage_account' $PARAM_FILE | tr -d '"')
          CONTAINER_NAME=$(yq '.container_name' $PARAM_FILE | tr -d '"')
          SOURCEACCOUNT=$(yq '.sourceaccount' $PARAM_FILE | tr -d '"')
          SOURCEURL=$(yq '.sourceURL' $PARAM_FILE | tr -d '"')
          SOURCEACCOUNT=$(yq '.sourceaccount' $PARAM_FILE | tr -d '"')
          SOURCEURL=$(yq '.sourceURL' $PARAM_FILE | tr -d '"')

          echo "SOURCEACCOUNT=$SOURCEACCOUNT" >> $GITHUB_ENV
          echo "SOURCEURL=$SOURCEURL" >> $GITHUB_ENV
          echo "STORAGE_ACCOUNT=$STORAGE_ACCOUNT" >> $GITHUB_ENV
          echo "CONTAINER_NAME=$CONTAINER_NAME" >> $GITHUB_ENV
          echo "SOURCE_DIR=storage_folder" >> $GITHUB_ENV

      - name: Azure login using Service Principal
        run: |
    
          az login --service-principal \
          --username "${{ secrets.AZURE_CLIENT_ID }}" \
          --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
          --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
    
        

      - name: Replace DEV values with Environment values
        run: |
    
          # For demo.json
          DEV_DEMO_SOURCEACCOUNT="rgdemostorage"
          DEV_DEMO_SOURCEURL="storagecamp01us2dev.dfs.core.windows.net"
          
          # For storage.json
          DEV_STORAGE_SOURCEACCOUNT="dev"
          DEV_STORAGE_SOURCEURL="storagecamp01us2dev"


          for file in $(find "$SOURCE_DIR" -name "*.json"); do
            echo "Updating $file"
            filename=$(basename "$file")


            if [[ "$filename" == "demo.json" ]]; then
              sed -i "s|$DEV_DEMO_SOURCEACCOUNT|$SOURCEACCOUNT|g" "$file"
              sed -i "s|$DEV_DEMO_SOURCEURL|$SOURCEURL|g" "$file"
          fi
        
          if [[ "$filename" == "storage.json" ]]; then
              sed -i "s|$DEV_STORAGE_SOURCEACCOUNT|$SOURCEACCOUNT|g" "$file"
              sed -i "s|$DEV_STORAGE_SOURCEURL|$SOURCEURL|g" "$file"
          fi

          done


      - name: Upload JSON files to Storage
        run: |
          
          for file in $(find "$SOURCE_DIR" -name "*.json"); do
            rel_path="demodb/$(basename "$file")"
            echo "Uploading $file --> $rel_path"

            az storage blob upload \
              --auth-mode login \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER_NAME" \
              --file "$file" \
              --name "$rel_path" \
              --overwrite
          done
