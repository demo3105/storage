name: Deploy JSON to Storage (Windows)

on:
  workflow_dispatch:

concurrency:
  group: github-metadata-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write
  contents: read

jobs:
  get_environment:
    name: Get Environment
    runs-on: windows-latest
    outputs:
      environment: ${{ steps.get_environment.outputs.environment }}
    steps:
      - id: get_environment
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"

          if ($branch -eq "test") {
             "environment=qa" >> $env:GITHUB_OUTPUT
          }
          elseif ($branch -eq "main") {
             "environment=prod" >> $env:GITHUB_OUTPUT
          }
          else {
             "environment=dev" >> $env:GITHUB_OUTPUT
          }

  deploy:
    name: Deploy Metadata - ${{ needs.get_environment.outputs.environment }}
    runs-on: windows-latest
    needs: [get_environment]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install yq on Windows
      - name: Install yq
        shell: pwsh
        run: |
          choco install yq -y

      - name: Load environment parameters
        id: params
        shell: pwsh
        run: |
          $ENV = "${{ needs.get_environment.outputs.environment }}"
          $PARAM_FILE = "parameter/$ENV.yml"

          Write-Host "Using parameter file: $PARAM_FILE"

          $STORAGE_ACCOUNT = yq e '.storage_account' $PARAM_FILE
          $CONTAINER_NAME  = yq e '.container_name' $PARAM_FILE
          $SOURCEACCOUNT   = yq e '.sourceaccount' $PARAM_FILE
          $SOURCEURL       = yq e '.sourceURL' $PARAM_FILE

          echo "STORAGE_ACCOUNT=$STORAGE_ACCOUNT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CONTAINER_NAME=$CONTAINER_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "SOURCEACCOUNT=$SOURCEACCOUNT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "SOURCEURL=$SOURCEURL" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "SOURCE_DIR=storage_folder" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Azure login using Service Principal
        shell: pwsh
        run: |
          az login --service-principal `
            --username  "${{ secrets.AZURE_CLIENT_ID }}" `
            --password  "${{ secrets.AZURE_CLIENT_SECRET }}" `
            --tenant    "${{ secrets.AZURE_TENANT_ID }}"

          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Replace DEV values with Environment values
        shell: pwsh
        run: |
          $SourceDir = $env:SOURCE_DIR

          $DEV_DEMO_SOURCEACCOUNT  = "rgdemostorage"
          $DEV_DEMO_SOURCEURL      = "storagecamp01us2dev.dfs.core.windows.net"
          $DEV_STORAGE_SOURCEACCOUNT = "dev"
          $DEV_STORAGE_SOURCEURL     = "storagecamp01us2dev"

          $jsonFiles = Get-ChildItem -Path $SourceDir -Recurse -Filter *.json

          foreach ($file in $jsonFiles) {
            Write-Host "Updating $file"

            $content = Get-Content $file.FullName

            if ($file.Name -eq "demo.json") {
              $content = $content -replace $DEV_DEMO_SOURCEACCOUNT, $env:SOURCEACCOUNT
              $content = $content -replace $DEV_DEMO_SOURCEURL, $env:SOURCEURL
            }

            if ($file.Name -eq "storage.json") {
              $content = $content -replace $DEV_STORAGE_SOURCEACCOUNT, $env:SOURCEACCOUNT
              $content = $content -replace $DEV_STORAGE_SOURCEURL, $env:SOURCEURL
            }

            Set-Content -Path $file.FullName -Value $content
          }

     # - name: Upload JSON files to Storage
    #    shell: pwsh
     #   run: |
      #    $SourceDir = $env:SOURCE_DIR
#
 #         $files = Get-ChildItem -Path $SourceDir -Recurse -Filter *.json
#
        #  foreach ($file in $files) {
         #   $rel_path = "demodb/$($file.Name)"
          #  Write-Host "Uploading $file --> $rel_path"

         #   az storage blob upload `
          #    --auth-mode login `
           #   --account-name  "$env:STORAGE_ACCOUNT" `
            #  --container-name "$env:CONTAINER_NAME" `
            #  --file "$($file.FullName)" `
            #  --name "$rel_path" `
            #  --overwrite
          #}
      - name: Upload all files to Storage (preserve existing folder structure)
        shell: pwsh
        run: |
          Write-Host "Deploying to RG=$env:RESOURCE_GROUP, Storage=$env:STORAGE_ACCOUNT, Container=$env:CONTAINER_NAME"
          Write-Host "SOURCE DIR = $env:SOURCE_DIR"
 
          if (-not (Test-Path -LiteralPath $env:SOURCE_DIR)) {
              Write-Error "ERROR: Folder $env:SOURCE_DIR does not exist!"
              exit 1
          }

          Write-Host "Scanning ALL files inside $env:SOURCE_DIR ..."

          # Collect ALL files
          $allFiles = Get-ChildItem -Path $env:SOURCE_DIR -Recurse -File

          if ($allFiles.Count -eq 0) {
              Write-Host "No files found. Nothing to upload."
              exit 0
          }

          # Absolute SOURCE_DIR for substring logic
          $sourceDirFull = (Resolve-Path -LiteralPath $env:SOURCE_DIR).Path

          foreach ($file in $allFiles) {

              $fullPath = $file.FullName

              # RELATIVE PATH (same as Bash: ${file#$SOURCE_DIR/})
              $relative = $fullPath.Substring($sourceDirFull.Length).TrimStart('\','/')

              # BLOB upload path
              $relPath = $relative

              Write-Host "Updating $($env:SOURCE_DIR)/$relative"
              Write-Host "Uploading $($env:SOURCE_DIR)/$relative --> $relPath"

              az storage blob upload `
                --auth-mode login `
                --account-name  $env:STORAGE_ACCOUNT `
                --container-name $env:CONTAINER_NAME `
                --file "$fullPath" `
                --name "$relPath" `
                --overwrite
          }

