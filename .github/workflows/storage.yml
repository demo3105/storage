name: Deploy JSON to Storage (Converted)

on:
  workflow_dispatch:

concurrency:
  group: github-metadata-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write
  contents: read

jobs:
  get_environment:
    name: Get Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.get_environment.outputs.environment }}
    steps:
      - id: get_environment
        run: |
          branch="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}"
          if [ "$branch" == "test" ]; then
            echo "environment=qa" >> "$GITHUB_OUTPUT"
          elif [ "$branch" == "main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy Metadata - ${{ needs.get_environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [get_environment]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      - name: Load environment parameters
        id: params
        run: |
          ENV="${{ needs.get_environment.outputs.environment }}"
          PARAM_FILE="parameter/${ENV}.yml"
          echo "Using parameter file: $PARAM_FILE"

          # Export top-level keys (excluding replacements) to GITHUB_ENV
          while IFS="=" read -r key value; do
            echo "${key^^}=$value" >> $GITHUB_ENV
          done < <(yq eval '. | del(.replacements) | to_entries | .[] | "\(.key)=\(.value)"' "$PARAM_FILE")

          echo "SOURCE_DIR=storage_folder" >> $GITHUB_ENV

      - name: Azure login using Service Principal
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Replace placeholders with environment values
        run: |
          ENV="${{ needs.get_environment.outputs.environment }}"
          PARAM_FILE="parameter/${ENV}.yml"

          for file in $(find "$SOURCE_DIR" -name "*.json"); do
            echo "Updating $file"
            # Loop through replacements map
            while IFS="=" read -r key value; do
              sed -i "s|$key|$value|g" "$file"
            done < <(yq eval '.replacements | to_entries | .[] | "\(.key)=\(.value)"' "$PARAM_FILE")
          done

      - name: Upload JSON files to Storage
        run: |
          echo "STORAGE_ACCOUNT=$STORAGE_ACCOUNT"
          echo "CONTAINER_NAME=$CONTAINER_NAME"

          for file in $(find "$SOURCE_DIR" -name "*.json"); do
            rel_path="demodb/$(basename "$file")"
            echo "Uploading $file --> $rel_path"
            az storage blob upload \
              --auth-mode login \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER_NAME" \
              --file "$file" \
              --name "$rel_path" \
              --overwrite
          done
