name: Deploy JSON to QA Storage

on:
  workflow_dispatch:

  push:
    branches:
      - test
    paths:
      - 'storage folder/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install yq
      run: |
        sudo apt-get update
        sudo apt-get install -y yq

    # Load QA parameters
    - name: Load QA parameters
      id: params
      run: |
        SOURCEACCOUNT=$(yq '.sourceaccount' parameter/qa.yml)
        SOURCEURL=$(yq '.sourceURL' parameter/qa.yml)

        echo "SOURCEACCOUNT=$OURCEACCOUNT" >> $GITHUB_OUTPUT
        echo "SOURCEURL=$SOURCEURL" >> $GITHUB_OUTPUT

    - name: Login to Azure using Service Principal
      run: |
        az login --service-principal \
          --username "${{ secrets.AZURE_CLIENT_ID }}" \
          --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
          --tenant "${{ secrets.AZURE_TENANT_ID }}"


    # Replace DEV values with QA values
    - name: Replace DEV values with QA values in JSON files
      run: |
        SOURCE_DIR="storage_folder"

        # DEV Values from your JSON
        DEV_SOURCEACCOUNT="rgdemostorage"
        DEV_SOURCEURL="storagecamp01us2dev.dfs.core.windows.net"

        for file in $(find "$SOURCE_DIR" -name "*.json"); do
          echo "Updating $file"

          # Replace sourceaccount
          sed -i "s/$DEV_SOURCEACCOUNT/${{ steps.params.outputs.SOURCEACCOUNT }}/g" "$file"

          # Replace sourceURL
          sed -i "s|$DEV_SOURCEURL|${{ steps.params.outputs.SOURCEURL }}|g" "$file"
        done


    # Upload JSON files
    - name: Upload JSON files to QA Storage
      run: |
        STORAGE_ACCOUNT="qademostorage123"
        CONTAINER_NAME="qadbcontroldb"
        SOURCE_DIR="storage_folder"

        for file in $(find "$SOURCE_DIR" -name "*.json"); do
          echo "Uploading $file"

          az storage blob upload \
            --auth-mode login \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER_NAME" \
            --file "$file" \
            --name "demodb/$(basename "$file")" \
            --overwrite
        done
