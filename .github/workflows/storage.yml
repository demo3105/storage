name: Deploy JSON to QA Storage

on:
  workflow_dispatch:

  push:
    branches:
      - test
    paths:
      - 'storage_folder/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install yq
      run: |
        sudo apt-get update
        sudo apt-get install -y yq

    # STEP 1: Load parameter file
    - name: Load QA Parameters
      id: params
      run: |
        STORAGE=$(yq '.storage_account' parameter/qa.yml)
        CONTAINER=$(yq '.container_name' parameter/qa.yml)
        RG=$(yq '.resource_group' parameter/qa.yml)

        echo "STORAGE=$STORAGE" >> $GITHUB_OUTPUT
        echo "CONTAINER=$CONTAINER" >> $GITHUB_OUTPUT
        echo "RG=$RG" >> $GITHUB_OUTPUT

    # STEP 2: Login to Azure
    - name: Login to Azure using Service Principal
      run: |
        az login --service-principal \
          --username "${{ secrets.AZURE_CLIENT_ID }}" \
          --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
          --tenant "${{ secrets.AZURE_TENANT_ID }}"

    # STEP 3: Upload JSON files
    - name: Upload JSON files to QA Storage
      run: |
        SOURCE_DIR="storage_folder"

        for file in $(find "$SOURCE_DIR" -name "*.json"); do
          echo "Uploading $file"

          az storage blob upload \
            --auth-mode login \
            --account-name "${{ steps.params.outputs.STORAGE }}" \
            --container-name "${{ steps.params.outputs.CONTAINER }}" \
            --file "$file" \
            --name "demodb/$(basename "$file")" \
            --overwrite
        done
